[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "google-flow-music"
version = "0.1.0"
description = "Local API for Flow Music using the user's signed-in Chrome session"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
keywords = ["flow-music", "fastapi", "chrome-extension", "music-generation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "aiosqlite>=0.20,<1",
    "fastapi>=0.115,<1",
    "pydantic>=2.8,<3",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.11,<1",
]

[project.scripts]
google-flow-music = "app.main:run"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["flowkit*", "tests*"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
extend-exclude = [".venv", "flowkit"]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["B", "E", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
